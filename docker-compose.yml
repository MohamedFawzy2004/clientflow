# Local development database only. Bound to 127.0.0.1 so it is never exposed on the network.
services:
  postgres:
    image: postgres:17.6-alpine
    container_name: clientflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: clientflow
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - clientflow-pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d clientflow']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  clientflow-pgdata:
