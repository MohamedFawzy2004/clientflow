# Local production-like STAGING (ADR-071): the real production image behind HTTPS, with its own
# PostgreSQL, ClamAV and a persistent file volume. Costs nothing; fictional data only.
#
#   npm run staging:up      # build the image and start everything (https://127.0.0.1:8443)
#   npm run staging:check   # staging-check.mjs against it (see docs/17_DEPLOYMENT.md)
#   npm run staging:down    # stop (volumes are kept)
#
# Settings and secrets: deploy/staging/.env.staging (gitignored), copied from
# deploy/staging/staging.env.example, passed with --env-file (the npm scripts do this). Nothing is reachable from the network: every published
# port is bound to 127.0.0.1.
name: clientflow-staging

services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${STAGING_PG_ADMIN_PASSWORD:?set STAGING_PG_ADMIN_PASSWORD in deploy/staging/.env.staging}
      POSTGRES_DB: postgres
      STAGING_APP_DB_PASSWORD: ${STAGING_APP_DB_PASSWORD:?set STAGING_APP_DB_PASSWORD}
    # Loopback only, for backups and restore drills from this machine (npm run backup/restore).
    ports:
      - '127.0.0.1:5434:5432'
    volumes:
      - staging-pgdata:/var/lib/postgresql/data
      - ./deploy/staging/init-db.sh:/docker-entrypoint-initdb.d/10-app-user.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d clientflow_staging']
      interval: 5s
      timeout: 3s
      retries: 30

  clamav:
    image: clamav/clamav:1.5.4
    restart: unless-stopped
    # Signatures take a minute or two to load; uploads are refused until it answers (ADR-070).
    healthcheck:
      test: ['CMD-SHELL', 'clamdcheck.sh']
      interval: 30s
      timeout: 10s
      start_period: 300s
      retries: 10

  app:
    build: .
    image: clientflow:staging
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://clientflow_app:${STAGING_APP_DB_PASSWORD}@postgres:5432/clientflow_staging
      CSRF_SECRET: ${CSRF_SECRET:?set CSRF_SECRET}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:?set FILE_ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # An IP address, not "localhost": browsers never remember HSTS for an IP (RFC 6797 §8.1), so
      # the production HSTS header cannot affect other local development servers.
      APP_ORIGINS: https://127.0.0.1:8443
      TRUST_PROXY: '1'
      CLAMAV_HOST: clamav
      CLAMAV_PORT: '3310'
      MAIL_TRANSPORT: disabled
      APP_RELEASE: ${APP_RELEASE:-local-staging}
    # The same order as a hosted release: migrate from the image, then start.
    command: ['sh', '-c', 'node apps/api/dist/cli/migrate.js && exec node apps/api/dist/server.js']
    volumes:
      - staging-files:/data/files
    depends_on:
      postgres:
        condition: service_healthy
      clamav:
        condition: service_healthy

  # TLS in front, as on a host: Caddy's own local certificate authority (export its root
  # certificate once, see docs/17_DEPLOYMENT.md). HTTP on 8080 redirects to HTTPS.
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:8443:8443'
      - '127.0.0.1:8080:8080'
    volumes:
      - ./deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - staging-caddy:/data
    depends_on:
      - app

volumes:
  staging-pgdata:
  staging-files:
  staging-caddy:
