# Secret scanning config (SEC-21). Extends the default gitleaks rules.
# Allowlisted values are fictional test fixtures only, never paths or folders: a real key
# committed to a test file must still fail the scan.
[extend]
useDefault = true

[allowlist]
description = "Fictional test fixtures (not credentials for any system)"
regexTarget = "secret"
regexes = [
  # Test passphrases, listed one by one (security audit F9). A shape rule such as
  # word-word-word-NN would also hide a real passphrase someone pastes into a file, so a new
  # fixture passphrase must be added here by name.
  '''^(?:amber-orchard-signal-(?:47|77|78)|quiet-harbor-lantern-58|violet-lantern-meadow-42)$''',
  '''^(?:tidal-copper-meadow-29|second-amber-violin-34|sahel-orchid-lantern-58)$''',
  '''^(?:river-nile-lantern-42|harbor-violet-quartz-63|delta-harbour-violet-77)$''',
  '''^(?:another-strong-phrase-91|amber-delta-window-73)$''',
  # Throwaway CSRF secrets used only inside unit/integration tests.
  '''^test-csrf-secret-that-is-long-enough-1234567890$''',
  '''^unit-test-secret-unit-test-secret-123$''',
  '''^another-secret-another-secret-12345$''',
  # Deliberately weak password used to prove the policy rejects it.
  '''^qwertyuiop12$''',
  # Fake Resend key shape used by the mail configuration tests (M12.1); not a real key.
  '''^re_abcdefgh1234$''',
]
