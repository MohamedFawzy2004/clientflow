# Fresh-checkout pipeline (NFR-11, T-OPS-02): every push and PR must install from the lockfile,
# pass static checks, run unit + integration tests on a real PostgreSQL, run E2E, and build.
# Actions are pinned to commit SHAs (supply-chain hygiene); the tag is noted beside each one.
name: CI

on:
  push:
    branches: [main, 'feat/**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test
  POSTGRES_USER: clientflow
  POSTGRES_PORT: '5432'
  APP_ORIGINS: http://localhost:5174
  LOG_LEVEL: warn
  MAIL_TRANSPORT: dev-sink

jobs:
  quality:
    name: Lint, typecheck, audit, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://unused:unused@127.0.0.1:5432/unused
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Gate on high/critical advisories in runtime dependencies (SEC-21).
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  test:
    name: Unit + integration (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: clientflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: clientflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clientflow" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_PASSWORD: ci-only-password
      DATABASE_URL: postgresql://clientflow:ci-only-password@127.0.0.1:5432/clientflow
      TEST_DATABASE_URL: postgresql://clientflow:ci-only-password@127.0.0.1:5432/clientflow_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Generate a throwaway CSRF secret
        run: |
          secret=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")
          echo "::add-mask::$secret"
          echo "CSRF_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Create test database
        run: PGPASSWORD=ci-only-password psql -h 127.0.0.1 -U clientflow -d clientflow -c "CREATE DATABASE clientflow_test;"
      - run: npm ci
      - run: npx prisma generate
      - run: npm test
      - run: npm run test:web

  e2e:
    name: End-to-end (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: clientflow
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: clientflow
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U clientflow" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      POSTGRES_PASSWORD: ci-only-password
      DATABASE_URL: postgresql://clientflow:ci-only-password@127.0.0.1:5432/clientflow
      E2E_DATABASE_URL: postgresql://clientflow:ci-only-password@127.0.0.1:5432/clientflow_e2e
      PLAYWRIGHT_CHANNEL: chromium
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Generate a throwaway CSRF secret
        run: |
          secret=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64url'))")
          echo "::add-mask::$secret"
          echo "CSRF_SECRET=$secret" >> "$GITHUB_ENV"
      - name: Create e2e database
        run: PGPASSWORD=ci-only-password psql -h 127.0.0.1 -U clientflow -d clientflow -c "CREATE DATABASE clientflow_e2e;"
      - run: npm ci
      - run: npx prisma generate
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
